name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run smoke
        env:
          CHROME: google-chrome
